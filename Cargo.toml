[package]
name = "cloudflare-reg"
version = "0.1.1"
edition = "2024"

[dependencies]
clap_complete = "4.5.2"
anyhow = "1.0.102"
base64 = "0.22.1"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking","json", "rustls", "system-proxy", "socks"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
x25519-dalek = { version = "2", features = ["getrandom", "static_secrets"] }
